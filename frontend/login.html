<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertChain — Admin Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-wrap {
      width: min(460px, 100%);
    }

    .login-card {
      padding: 34px;
      border-radius: 24px;
      background: rgba(17, 22, 44, 0.92);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: linear-gradient(135deg, #6c63ff, #3ec5ff);
      font-size: 32px;
    }

    .login-brand h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .login-brand p {
      margin: 0;
      color: #8e96b5;
    }

    .login-form {
      display: grid;
      gap: 18px;
    }

    .login-form label {
      display: grid;
      gap: 8px;
      color: #c4cbe0;
      font-size: 14px;
      font-weight: 600;
    }

    .login-form input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.10);
      background: #0c1024;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    .login-form input:focus {
      border-color: rgba(62,197,255,0.55);
    }

    .login-btn {
      width: 100%;
      margin-top: 4px;
    }

    .login-message {
      min-height: 22px;
      text-align: center;
      font-size: 14px;
    }

    .login-message.error {
      color: #ff7585;
    }

    .login-message.success {
      color: #48e0ad;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #8e96b5;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>

  <main class="login-wrap">
    <section class="login-card">
      <div class="login-brand">
        <div class="login-icon">🔐</div>
        <h1>Admin Login</h1>
        <p>CertChain Administration Panel</p>
      </div>

      <form class="login-form" id="loginForm">
        <label>
          Username
          <input
            type="text"
            id="username"
            autocomplete="username"
            placeholder="Enter admin username"
            required>
        </label>

        <label>
          Password
          <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required>
        </label>

        <button class="btn btn-primary login-btn" id="loginBtn" type="submit">
          Login as Administrator
        </button>

        <div class="login-message" id="loginMessage"></div>
      </form>

      <a class="back-link" href="index.html">← Back to CertChain</a>
    </section>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    const form = document.getElementById("loginForm");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("loginMessage");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      message.className = "login-message";
      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";

      try {
        const response = await fetch(`${API_BASE}/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username.value.trim(),
            password: password.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || `Login failed (${response.status})`);
        }

        if (data.role !== "admin") {
          localStorage.removeItem("certchain_token");
          throw new Error("Admin access required.");
        }

        localStorage.setItem("certchain_token", data.access_token);

        message.textContent = "Login successful. Opening Admin Dashboard...";
        message.className = "login-message success";

        setTimeout(() => {
          window.location.href = "admin.html";
        }, 500);
      } catch (error) {
        message.textContent = error.message;
        message.className = "login-message error";
        loginBtn.disabled = false;
        loginBtn.textContent = "Login as Administrator";
      }
    });
  </script>
</body>
</html>
